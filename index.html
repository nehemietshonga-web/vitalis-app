/* =========================================================

function todayStr(){

  return new Date()
    .toISOString()
    .slice(0,10);

}


function escapeHtml(s){

  return (s || '')
    .toString()
    .replace(
      /[&<>"']/g,
      c => ({
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#39;'
      }[c])
    );

}


function formatDate(d){

  if(!d) return '';

  const parts =
    d.split('-');

  if(parts.length !== 3)
    return d;

  const months = [
    'janv.','févr.','mars','avr.',
    'mai','juin','juil.','août',
    'sept.','oct.','nov.','déc.'
  ];

  return `
    ${parts[2]}
    ${months[Number(parts[1])-1]}
    ${parts[0]}
  `;

}


function calcAge(birthDate){

  if(!birthDate)
    return null;

  const b =
    new Date(birthDate);

  const n =
    new Date();

  let age =
    n.getFullYear() -
    b.getFullYear();

  if(
    n.getMonth() < b.getMonth() ||
    (
      n.getMonth() === b.getMonth() &&
      n.getDate() < b.getDate()
    )
  ){
    age--;
  }

  return age;

}


function calcBMI(
  heightCm,
  weightKg
){

  if(!heightCm || !weightKg)
    return null;

  const h =
    Number(heightCm) / 100;

  return (
    Number(weightKg) /
    (h * h)
  ).toFixed(1);

}

/* =========================================================
   AUTH
   ========================================================= */

async function checkAuth(){

  if(!supabaseClient)
    return;

  try{

    const {
      data,
      error
    } =
      await supabaseClient.auth.getSession();

    if(error)
      throw error;

    currentSession =
      data.session || null;

    currentUser =
      currentSession
        ? currentSession.user
        : null;


    const hash =
      window.location.hash || '';

    if(
      hash.includes('type=recovery') ||
      hash.includes('access_token=')
    ){

      isRecoveryMode = true;

    }


    supabaseClient.auth.onAuthStateChange(
      async (
        event,
        session
      ) => {

        currentSession =
          session || null;

        currentUser =
          session
            ? session.user
            : null;


        if(
          event === 'PASSWORD_RECOVERY'
        ){

          isRecoveryMode = true;

          render();

          return;

        }


        if(
          event === 'SIGNED_OUT'
        ){

          currentSession = null;
          currentUser = null;

          clients = [];
          activeClientData = null;
          bilans = [];

          render();

        }

      }
    );

  }catch(error){

    console.error(
      'Erreur auth:',
      error
    );

  }

}


/* =========================================================

async function loginUser(
  email,
  password
){

  if(!supabaseClient){

    showAuthMessage(
      'Supabase n’est pas correctement chargé.'
    );

    return;

  }

  if(
    !email.trim() ||
    !password

      'Entre ton e-mail et ton mot de passe.'

    return;

  }

  const btn =
    document.getElementById(

    btn.disabled = true;

      'Connexion...';

  clearAuthMessage();

  try{

    const {
      data,
      error
    } =
      await supabaseClient.auth
        .signInWithPassword({

          email:
            email.trim(),

          password

        });

    if(error)
      throw error;

    currentSession =
      data.session;

    currentUser =
      data.user;


    await afterLogin();

    showToast(

  }finally{

    if(btn){

      btn.textContent =
        'Se connecter';

  }

}

    return;

  }

  if(
    password !== confirmPassword
  ){

    showAuthMessage(
      'Les deux mots de passe ne correspondent pas.'
    );

    return;

  }

  const btn =
    document.getElementById(
      'register-btn'
    );

  if(btn){

    btn.disabled = true;

    btn.textContent =
      'Création...';

  }

  clearAuthMessage();

  try{

    /*
      Le compte cliente doit être créé
      depuis son lien d'invitation.
    */

    if(!INVITE_CODE){

      throw new Error(
        'Ce formulaire doit être ouvert depuis le lien envoyé par VITALIS.'
      );

    }


    /*
      Vérifie que le lien existe.
    */

    const {
      data:client,
      error:clientError
    } =
      await supabaseClient
        .from('vitalis_clients')
        .select('id,name,email')
        .eq(
          'invitation_code',
          INVITE_CODE
        )
        .maybeSingle();

    if(clientError)
      throw clientError;

    if(!client){

      throw new Error(
        'Lien d’invitation invalide ou expiré.'
      );

    }


    /*
      Crée le compte Supabase.
    */

    const {
      data,
      error
    } =
      await supabaseClient.auth
        .signUp({

          email,
          password,

          options:{
            emailRedirectTo:
              baseUrl()
          }

        });

    if(error)
      throw error;


    /*
      Enregistre l’e-mail dans la fiche cliente.
    */

    const {
      error:updateError
    } =
      await supabaseClient
        .from('vitalis_clients')
        .update({
          email
        })
        .eq(
          'id',
          client.id
        );

    if(updateError)
      throw updateError;


    if(data.session){

      currentSession =
        data.session;

      currentUser =
        data.user;

      await loadActiveClient();
      await loadBilans();

      authScreen =
        'login';

      render();

      showToast(
        'Compte créé ✅'
      );

    }else{

      showAuthMessage(
        'Compte créé ✅ Vérifie ton e-mail pour confirmer ton compte, puis connecte-toi.',
        'success'
      );

    }

  }catch(error){

    console.error(
      'Erreur création compte:',
      error
    );

    let message =
      error.message ||
      'Impossible de créer le compte.';

    if(
      message.toLowerCase().includes(
        'user already registered'
      )
    ){

      message =
        'Un compte existe déjà avec cet e-mail. Connecte-toi plutôt.';

    }

    showAuthMessage(
      message
    );

  }finally{

    if(btn){

      btn.disabled = false;

      btn.textContent =
        'Créer mon compte';

    }

  }

}


/* =========================================================
   RECUPERATION MOT DE PASSE
   ========================================================= */

async function sendPasswordRecovery(
  email
){

  if(!email || !email.trim()){

    showAuthMessage(
      'Entre ton adresse e-mail.'
    );

    return;

  }

  const btn =
    document.getElementById(
      'recovery-btn'
    );

  if(btn){

    btn.disabled = true;

    btn.textContent =
      'Envoi...';

  }

  clearAuthMessage();

  try{

    const {
      error
    } =
      await supabaseClient.auth
        .resetPasswordForEmail(
          email.trim(),
          {
            redirectTo:
              baseUrl()
          }
        );

    if(error)
      throw error;

    showAuthMessage(
      'E-mail envoyé ✅ Vérifie ta boîte de réception et tes spams.',
      'success'
    );

  }catch(error){

    console.error(error);

    showAuthMessage(
      error.message ||
      'Impossible d’envoyer l’e-mail.'
    );

  }finally{

    if(btn){

      btn.disabled = false;

      btn.textContent =
        'Envoyer le lien de récupération';

    }

  }

}


/* =========================================================
   NOUVEAU MOT DE PASSE
   ========================================================= */

async function updatePassword(
  password,
  confirmPassword
){

  if(password.length < 6){

    showAuthMessage(
      'Le mot de passe doit contenir au moins 6 caractères.'
    );

    return;

  }

  if(
    password !== confirmPassword
  ){

    showAuthMessage(
      'Les deux mots de passe ne correspondent pas.'
    );

    return;

  }

  const btn =
    document.getElementById(
      'update-password-btn'
    );

  if(btn){

    btn.disabled = true;

    btn.textContent =
      'Enregistrement...';

  }

  try{

    const {
      error
    } =
      await supabaseClient.auth
        .updateUser({
          password
        });

    if(error)
      throw error;

    showAuthMessage(
      'Mot de passe enregistré ✅',
      'success'
    );

    setTimeout(
      () => {

        window.history.replaceState(
          {},
          document.title,
          baseUrl()
        );

        isRecoveryMode = false;

        authScreen =
          'login';

        render();

      },
      1500
    );

  }catch(error){

    console.error(error);

    showAuthMessage(
      error.message ||
      'Impossible de modifier le mot de passe.'
    );

  }finally{

    if(btn){

      btn.disabled = false;

      btn.textContent =
        'Enregistrer le nouveau mot de passe';

    }

  }

}

/* =========================================================
   LOAD CLIENTS
   ========================================================= */

async function loadClients(){

  if(!currentUser)
    return;

  const {
    data,
    error
  } =
    await supabaseClient
      .from('vitalis_clients')
      .select('*')
      .order(
        'created_at',
        {
          ascending:false
        }
      );

  if(error)
    throw error;

  clients =
    data || [];

}


/* =========================================================
   LOAD ACTIVE CLIENT
   ========================================================= */

async function loadActiveClient(){

  if(!isClientMode && !activeClientId){

    activeClientData = null;

    return;

  }

  try{

    if(isClientMode){

      const {
        data,
        error
      } =
        await supabaseClient
          .rpc(
            'get_client_by_invitation',
            {
              p_invitation_code:
                INVITE_CODE
            }
          );

      if(error)
        throw error;

      activeClientData =
        data || null;

    }else{

      const {
        data,
        error
      } =
        await supabaseClient
          .from('vitalis_clients')
          .select('*')
          .eq(
            'id',
            activeClientId
          )
          .maybeSingle();

      if(error)
        throw error;

      activeClientData =
        data || null;

    }

    if(activeClientData){

      activeClientId =
        activeClientData.id;

    }

  }catch(error){

    console.error(
      'Erreur chargement client:',
      error
    );

    activeClientData = null;

    throw error;

  }

}
/* =========================================================
   LOAD BILANS
   ========================================================= */

async function loadBilans(){

  if(!activeClientId){

    bilans = [];

    return;

  }

  if(isClientMode){

    const {
      data,
      error
    } =
      await supabaseClient
        .rpc(
          'get_client_bilans_by_invitation',
          {
            p_invitation_code:
              INVITE_CODE
          }
        );

    if(error)
      throw error;

    bilans =
      Array.isArray(data)
        ? data
        : [];

    return;

  }

  const {
    data,
    error
  } =
    await supabaseClient
      .from('vitalis_bilans')
      .select('*')
      .eq(
        'client_id',
        activeClientId
      )
      .order(
        'date',
        {
          ascending:false
        }
      );

  if(error)
    throw error;

  bilans =
    data || [];

}

/* =========================================================
   AFTER LOGIN
   ========================================================= */

async function afterLogin(){

  if(isClientMode){

    await loadActiveClient();

    await loadBilans();

    activeTab =
      'new';

  }else{

    await loadClients();

    if(
      clients.length &&
      !activeClientId
    ){

      activeClientId =
        clients[0].id;

      await loadActiveClient();

      await loadBilans();

    }

  }

  render();

}

async function submitPayment(){

  const referenceInput =
    document.getElementById(
      'payment-reference'
    );

  const reference =
    referenceInput
      ? referenceInput.value.trim()
      : '';

  if(!activeClientId){

    showToast(
      'Client introuvable'
    );

    return;

  }

  if(!reference){

    showToast(
      'Veuillez entrer la référence du paiement'
    );

    return;

  }

  try{

    const { error } =
      await supabaseClient
        .rpc(
          'submit_client_payment',
          {
            p_invitation_code:
              INVITE_CODE,

            p_payment_reference:
              reference
          }
        );

    if(error)
      throw error;

    showToast(
      'Paiement envoyé à votre professionnelle ✅'
    );

    render();

  }catch(error){

    console.error(
      'Erreur paiement:',
      error
    );

    showToast(
      'Impossible d’enregistrer le paiement'
    );

  }

}

/* =========================================================
   EVOLUTION
   ========================================================= */

function renderProgress(){

  const c =
    activeClient();

  if(!c){

    return `

      <div class="card">

        <div class="empty">
          Sélectionne une cliente.
        </div>

      </div>

    `;

  }


  if(!bilans.length){

    return `

      <div class="card">

        <div class="empty">
          Pas encore assez de données.
        </div>

      </div>

    `;

  }


  const sorted =
    [...bilans]
      .sort(
        (a,b) =>
          String(a.date)
            .localeCompare(
              String(b.date)
            )
      );


  const withWeight =
    sorted.filter(
      e =>
        e.weight !== null &&
        e.weight !== undefined &&
        e.weight !== ''
    );


  const withSleep =
    sorted.filter(
      e =>
        e.sleep_hours !== null &&
        e.sleep_hours !== undefined &&
        e.sleep_hours !== ''
    );


  const avgSleep =
    withSleep.length
      ? (
          withSleep.reduce(
            (s,e) =>
              s + Number(e.sleep_hours),
            0
          ) /
          withSleep.length
        ).toFixed(1)
      : '—';


  const lastBmi =
    c.height_cm &&
    withWeight.length
      ? calcBMI(
          c.height_cm,
          withWeight[
            withWeight.length - 1
          ].weight
        )
      : null;


  function lineChart(
    list,
    key,
    lo,
    hi
  ){

    if(!list.length)
      return '';

    const w = 300;
    const h = 100;
    const pad = 10;

    const vals =
      list.map(
        e => Number(e[key])
      );

    let min =
      lo !== undefined
        ? lo
        : Math.min(...vals) - .5;

    let max =
      hi !== undefined
        ? hi
        : Math.max(...vals) + .5;

    if(max === min)
      max = min + 1;

    const pts =
      list.map(
        (e,i) => {

          const x =
            pad +
            (
              i /
              (list.length - 1 || 1)
            ) *
            (w - 2 * pad);

          const y =
            h -
            pad -
            (
              (Number(e[key]) - min) /
              (max - min)
            ) *
            (h - 2 * pad);

          return `${x},${y}`;

        }
      ).join(' ');


    return `

      <svg
        viewBox="0 0 ${w} ${h}"
      >

        <polyline
          points="${pts}"
          fill="none"
          stroke="#4f7a5c"
          stroke-width="2.5"
          stroke-linejoin="round"
          stroke-linecap="round"
        />

      </svg>

    `;

  }


  const weightChart =
    withWeight.length >= 2
      ? `

        <div class="card">

          <div class="section-label">
            ⚖️ ÉVOLUTION DU POIDS
          </div>

          <div class="chart-wrap">

            ${lineChart(
              withWeight,
              'weight'
            )}

          </div>

          <div class="chart-caption">

            <span>
              ${withWeight[0].weight} kg
            </span>

            <span>
              ${
                withWeight[
                  withWeight.length - 1
                ].weight
              } kg
            </span>

          </div>

        </div>

      `
      : '';


  const sleepChart =
    withSleep.length >= 2
      ? `

        <div class="card">

          <div class="section-label">
            😴 ÉVOLUTION DU SOMMEIL
          </div>

          <div class="chart-wrap">

            ${lineChart(
              withSleep,
              'sleep_hours',
              0,
              10
            )}

          </div>

        </div>

      `
      : '';


  const totalPaye =
    sorted
      .filter(
        e =>
          e.payment_status === 'paye'
      )
      .reduce(
        (s,e) =>
          s +
          (
            Number(
              e.payment_amount
            ) || 0
          ),
        0
      );


  const countAttente =
    sorted.filter(
      e =>
        e.payment_status === 'attente'
    ).length;


  return `

    <div class="stat-grid">

      <div class="stat-box">

        <div class="num">
          ${sorted.length}
        </div>

        <div class="lbl">
          📋 BILANS
        </div>

      </div>


      <div class="stat-box">

        <div class="num">
          ${avgSleep}
        </div>

        <div class="lbl">
          😴 SOMMEIL MOYEN
        </div>

      </div>


      <div class="stat-box">

        <div class="num">

          ${
            withWeight.length
              ? withWeight[
                  withWeight.length - 1
                ].weight
              : '—'
          }

        </div>

        <div class="lbl">
          ⚖️ DERNIER POIDS
        </div>

      </div>


      <div class="stat-box">

        <div class="num">
          ${lastBmi || '—'}
        </div>

        <div class="lbl">
          📐 IMC ACTUEL
        </div>

      </div>

    </div>


    <div class="card">

      <div class="section-label">
        💰 PAIEMENTS
      </div>

      <div class="entry-stats">

        <span>
          Total encaissé :
          <b style="color:var(--green)">
            ${totalPaye}
          </b>
        </span>

        <span>
          En attente :
          <b style="color:var(--terracotta)">
            ${countAttente}
          </b>
        </span>

      </div>

    </div>


    ${weightChart}

    ${sleepChart}

  `;

}

function render(){

    L'espace professionnel nécessite
    une connexion.
  */

  if(
    !isClientMode &&
    !currentSession
  ){

    document.getElementById(
      'header-subtitle'
    ).textContent =
      'CONNEXION';

    renderAuth();

    return;

  }


  

  
    

  


  document.getElementById(
    'header-subtitle'
  ).textContent =
    isClientMode
      ? 'ESPACE CLIENTE'
      : 'SUIVI NATUROPATHIE';


  renderHeader();

  renderTabs();


  const main =
    document.getElementById(
      'main'
    );


  if(
    activeTab === 'clients' &&
    !isClientMode
  ){

    main.innerHTML =
      renderClients();

  }

  else if(
    activeTab === 'profile'
  ){

    main.innerHTML =
      renderProfile();

  }
  
  else if(
  activeTab === 'payment'
){

  main.innerHTML =
    renderPayment();

}

  else if(
    activeTab === 'new'
  ){

    main.innerHTML =
      renderNew();

  }

  else if(
    activeTab === 'history'
  ){

    main.innerHTML =
      renderHistory();

  }

  else if(
    activeTab === 'progress'
  ){

    main.innerHTML =
      renderProgress();

  }

  else{

    main.innerHTML =
      renderProgress();

  }


  attachHandlers();

}

async function startClientSignup(){

  const email = prompt(
    "Entre ton adresse e-mail :"
  );

  if(!email) return;

  const password = prompt(
    "Choisis ton mot de passe (6 caractères minimum) :"
  );

  if(!password) return;

  if(password.length < 6){

    alert(
      "Le mot de passe doit contenir au moins 6 caractères."
    );

    return;
  }

  try{

    const {
      data,
      error
    } =
      await supabaseClient.auth.signUp({

        email: email.trim(),
        password,

        options:{
          emailRedirectTo: baseUrl()
        }

      });

    if(error)
      throw error;

    alert(
      "✅ Compte créé !\n\n" +
      "Tu peux maintenant te connecter avec ton adresse e-mail et ton mot de passe."
    );

  }catch(error){

    console.error(
      "Erreur création compte :",
      error
    );

    alert(
      "Impossible de créer le compte : " +
      (error.message || "Erreur inconnue")
    );

  }

}
async function init(){

  try{

    await checkAuth();


    /*
      Si une session existe déjà,
      on charge directement l'espace.
    */

    if(isClientMode){

  await loadActiveClient();
  await loadBilans();

    }
    
    if(currentSession){

      await afterLogin();

      return;

    }


    render();

  }catch(error){

    console.error(
      'Erreur initialisation:',
      error
    );


    document.getElementById(
      'main'
    ).innerHTML = `

      <div class="card">

        <div class="section-label">
          ⚠️ ERREUR
        </div>

        <p class="small">

          VITALIS a rencontré une erreur
          lors du chargement.

        </p>

        <div class="link-box">

          ${escapeHtml(
            error.message ||
            'Erreur inconnue'
          )}

        </div>

        <button
          class="btn-primary"
          onclick="location.reload()"
        >
          Recharger VITALIS
        </button>

      </div>

    `;

  }

}


init();
