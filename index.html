function todayStr(){
  return new Date().toISOString().slice(0,10);
}

function escapeHtml(s){
  return (s||'').toString().replace(
    /[&<>"']/g,
    c => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[c])
  );
}

function formatDate(d){
  if(!d) return '';

  const [y,m,day] = d.split('-');

  const months = [
    'janv.','févr.','mars','avr.','mai','juin',
    'juil.','août','sept.','oct.','nov.','déc.'
  ];

  return `${day} ${months[Number(m)-1]} ${y}`;
}

function calcAge(birthDate){
  if(!birthDate) return null;

  const b = new Date(birthDate);
  const n = new Date();

  let age = n.getFullYear() - b.getFullYear();

  if(
    n.getMonth() < b.getMonth() ||
    (
      n.getMonth() === b.getMonth() &&
      n.getDate() < b.getDate()
    )
  ){
    age--;
  }

  return age;
}

function calcBMI(heightCm,weightKg){
  if(!heightCm || !weightKg) return null;

  const h = heightCm / 100;

  return (weightKg/(h*h)).toFixed(1);
}

    return null;
  }

  return data.session;

/*
   IMPORTANT :
   Ta table Profiles possède :
   Id
   Full_name_at
   Role
   Created_at

   On récupère donc le profil avec Id = UID.
*/

async function loadProfile(){

  if(!currentUser){
    currentProfile = null;
    return null;
  }

  try{

    const {
      data,
      error
    } = await supabaseClient
      .from('Profiles')
      .select('*')
      .eq('Id',currentUser.id)
      .maybeSingle();

    if(error){
      console.error('Erreur profil:',error);
      currentProfile = null;
      return null;
    }

    currentProfile = data;

    return data;

  }catch(e){

    console.error(e);
    currentProfile = null;

    return null;
  }
}


function getRole(){

  if(!currentProfile || !currentProfile.Role){
    return null;
  }

  return String(currentProfile.Role)
    .trim()
    .toLowerCase();
}


function isNaturopathe(){

  const role = getRole();

  return [
    'naturopathe',
    'naturopath',
    'admin',
    'administrator'
  ].includes(role);
}


function isClient(){

  const role = getRole();

  return role === 'client';
}

  const password =
    document.getElementById('login-password').value;

  if(!email || !password){

    renderLogin('Remplis ton adresse e-mail et ton mot de passe.');

    return;
  }

  const btn = document.getElementById('login-btn');

  btn.disabled=true;
  btn.textContent='Connexion...';

  try{

    const {
      data,
      error
    } = await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

    if(error){
      throw error;
    }

    currentUser=data.user;

    await loadProfile();

    if(!currentProfile){

      await supabaseClient.auth.signOut();

      currentUser=null;

      renderLogin(
        "Ton compte existe, mais aucun profil VITALIS n'est associé à ce compte."
      );

      return;
    }

    if(!isNaturopathe() && !isClient()){

      await supabaseClient.auth.signOut();

      currentUser=null;
      currentProfile=null;

      renderLogin(
        "Le rôle de ce compte n'est pas configuré dans VITALIS."
      );

      return;
    }

    await initApp();

  }catch(e){

    console.error(e);

    renderLogin(
      "Connexion impossible. Vérifie ton e-mail et ton mot de passe."
    );
  }
}


async function resetPassword(){

  const email =
    document.getElementById('login-email').value.trim();

  if(!email){

    showToast("Entre ton e-mail d'abord");

    return;
  }

  try{

    const {error} =
      await supabaseClient.auth.resetPasswordForEmail(
        email,
        {
          redirectTo:window.location.origin +
            window.location.pathname
        }
      );

    if(error) throw error;

    showToast("E-mail de réinitialisation envoyé 📧");

  }catch(e){

    console.error(e);

    showToast("Impossible d'envoyer l'e-mail");
  }
}


async function logout(){

  await supabaseClient.auth.signOut();

  currentUser=null;
  currentProfile=null;

  clients=[];
  activeClientId=null;
  activeClientData=null;
  bilans=[];

  renderLogin();
}


/* =========================================================

   ========================================================= */

async function loadClients(){

  if(!isNaturopathe()) return;

  try{

    const {
      data,
      error
    } = await supabaseClient
      .from('vitalis_clients')
      .select('*')
      .order('created_at',{ascending:false});

    if(error) throw error;

    clients=data || [];

  }catch(e){

    console.error('Erreur clients:',e);

    clients=[];
  }
}


async function loadActiveClient(){

  if(!activeClientId){

    activeClientData=null;

    return;
  }

  try{

    const {
      data,
      error
    } = await supabaseClient
      .from('vitalis_clients')
      .select('*')
      .eq('id',activeClientId)
      .maybeSingle();

    if(error) throw error;

    activeClientData=data || null;

  }catch(e){

    console.error(e);

    activeClientData=null;
  }
}


async function loadBilans(){

  if(!activeClientId){

    bilans=[];

    return;
  }

  try{

    const {
      data,
      error
    } = await supabaseClient
      .from('vitalis_bilans')
      .select('*')
      .eq('client_id',activeClientId)
      .order('date',{ascending:false});

    if(error) throw error;

    bilans=data || [];

  }catch(e){

    console.error('Erreur bilans:',e);

    bilans=[];
  }
}

/* =========================================================
   ÉVOLUTION
   ========================================================= */

function renderProgress(){

  const c=activeClient();

  if(!c){

    return `
      <div class="card">
        <div class="empty">
          Sélectionne une cliente.
        </div>
      </div>
    `;
  }

  if(bilans.length===0){

    return `
      <div class="card">
        <div class="empty">
          Pas encore assez de données.
        </div>
      </div>
    `;
  }


  const sorted=[...bilans].sort(
    (a,b)=>a.date.localeCompare(b.date)
  );

  const withWeight=sorted.filter(e=>e.weight);

  const withSleep=sorted.filter(e=>e.sleep_hours);

  const avgSleep=withSleep.length

    ?

    (
      withSleep.reduce(
        (s,e)=>s+Number(e.sleep_hours),
        0
      )
      /
      withSleep.length
    ).toFixed(1)

    :

    '—';


  const lastBmi=
    c.height_cm && withWeight.length

    ?

    calcBMI(
      c.height_cm,
      withWeight[withWeight.length-1].weight
    )

    :

    null;


  function lineChart(list,key,color,lo,hi){

    const w=300;
    const h=100;
    const pad=10;

    const vals=list.map(e=>Number(e[key]));

    const min=
      lo!==undefined
      ?
      lo
      :
      Math.min(...vals)-.5;

    const max=
      hi!==undefined
      ?
      hi
      :
      Math.max(...vals)+.5;

    const pts=list.map((e,i)=>{

      const x=
        pad+
        (i/(list.length-1||1))*
        (w-2*pad);

      const y=
        h-pad-
        ((Number(e[key])-min)/(max-min))*
        (h-2*pad);

      return `${x},${y}`;

    }).join(' ');

    return `
      <svg viewBox="0 0 ${w} ${h}">
        <polyline
          points="${pts}"
          fill="none"
          stroke="${color}"
          stroke-width="2.5"
          stroke-linejoin="round"
          stroke-linecap="round"
        />
      </svg>
    `;
  }


  const weightChart=

    withWeight.length>=2

    ?

    `
      <div class="card">

        <div class="section-label">
          ⚖️ Évolution du poids
        </div>

        <div class="chart-wrap">
          ${lineChart(
            withWeight,
            'weight',
            '#4f7a5c'
          )}
        </div>

        <div class="chart-caption">
          <span>
            ${withWeight[0].weight}kg
          </span>

          <span>
            ${withWeight[withWeight.length-1].weight}kg
          </span>
        </div>

      </div>
    `

    :

    '';


  const sleepChart=

    withSleep.length>=2

    ?

    `
      <div class="card">

        <div class="section-label">
          😴 Évolution du sommeil
        </div>

        <div class="chart-wrap">
          ${lineChart(
            withSleep,
            'sleep_hours',
            '#5b8a9a',
            0,
            10
          )}
        </div>

      </div>
    `

    :

    '';


  const totalPaye=
    sorted
      .filter(e=>e.payment_status==='paye')
      .reduce(
        (s,e)=>s+(Number(e.payment_amount)||0),
        0
      );


  const countAttente=
    sorted.filter(
      e=>e.payment_status==='attente'
    ).length;


  return `

    <div class="stat-grid">

      <div class="stat-box">
        <div class="num">
          ${sorted.length}
        </div>
        <div class="lbl">
          📋 Bilans
        </div>
      </div>

      <div class="stat-box">
        <div class="num">
          ${avgSleep}
        </div>
        <div class="lbl">
          😴 Sommeil moyen
        </div>
      </div>

      <div class="stat-box">
        <div class="num">
          ${
            withWeight.length
            ?
            withWeight[withWeight.length-1].weight
            :
            '—'
          }
        </div>
        <div class="lbl">
          ⚖️ Dernier poids
        </div>
      </div>

      <div class="stat-box">
        <div class="num">
          ${lastBmi||'—'}
        </div>
        <div class="lbl">
          📐 IMC actuel
        </div>
      </div>

    </div>

    ${
      isNaturopathe()
      ?
      `
        <div class="card">

          <div class="section-label">
            💰 Paiements
          </div>

          <div class="entry-stats">

            <span>
              Total encaissé :
              <b style="color:var(--green)">
                ${totalPaye}
              </b>
            </span>

            <span>
              En attente :
              <b style="color:var(--terracotta)">
                ${countAttente}
              </b>
            </span>

          </div>

        </div>
      `
      :
      ''
    }

    ${weightChart}

    ${sleepChart}

  `;
}


/* =========================================================
   CLIENT AUTHENTIFIÉ
   ========================================================= */

async function loadClientAccount(){

  if(!currentUser) return false;

  /*
    Pour éviter qu'un client puisse modifier l'URL
    et accéder aux données d'un autre client,
    on cherche une fiche dont l'e-mail correspond
    à l'e-mail du compte connecté.
  */

  const {
    data,
    error
  } = await supabaseClient
    .from('vitalis_clients')
    .select('*')
    .eq('email',currentUser.email)
    .maybeSingle();

  if(error){

    console.error(
      'Erreur association client:',
      error
    );

    return false;
  }

  if(!data){

    return false;
  }

  activeClientId=data.id;
  activeClientData=data;

  await loadBilans();

  return true;
}


/* =========================================================
   RENDER PRINCIPAL
   ========================================================= */

async function render(){

  renderHeader();
  renderTabs();

  const main=document.getElementById('main');

  if(
    activeTab==='clients' &&
    isNaturopathe()
  ){

    main.innerHTML=renderClients();

  }else if(activeTab==='profile'){

    main.innerHTML=renderProfile();

  }else if(activeTab==='new'){

    main.innerHTML=renderNew();

  }else if(activeTab==='history'){

    main.innerHTML=renderHistory();

  }else{

    main.innerHTML=renderProgress();
  }

  attachHandlers();
}

   ========================================================= */

function attachHandlers(){

  const logoutBtn=
    document.getElementById('logout-btn');

  if(logoutBtn){

    logoutBtn.onclick=logout;
  }


  const clientPill=
    document.getElementById('client-pill');

  if(clientPill){

    clientPill.onclick=async()=>{

      if(isNaturopathe()){

        activeTab='clients';

        await render();
      }
    };
  }


  document
    .querySelectorAll('[data-act="select-client"]')
    .forEach(el=>{

      el.onclick=async(ev)=>{

        if(
          ev.target.closest(
            '[data-act="delete-client"]'
          )
        ){

          return;
        }

        activeClientId=el.dataset.id;

        await loadActiveClient();

        await loadBilans();

        activeTab='profile';

        await render();
      };

    });


  document
    .querySelectorAll('[data-act="delete-client"]')
    .forEach(el=>{

      el.onclick=async(ev)=>{

        ev.stopPropagation();

        if(!confirm(
          'Supprimer cette cliente et ses données ?'
        )){

          return;
        }

        try{

          const {
            error
          } = await supabaseClient
            .from('vitalis_clients')
            .delete()
            .eq('id',el.dataset.id);

          if(error) throw error;

          if(activeClientId===el.dataset.id){

            activeClientId=null;
            activeClientData=null;
            bilans=[];

          await loadClients();

      }


      const payload={

        client_id:
          activeClientId,

        date:
          form.date || todayStr(),

        weight:
          form.weight
          ?
          Number(form.weight)
          :
          null,

        waist:
          form.waist
          ?
          Number(form.waist)
          :
          null,

        petit_dejeuner:
          form.petit_dejeuner,

        dejeuner:
          form.dejeuner,

        diner:
          form.diner,

        collations:
          form.collations,

        hydratation_l:
          form.hydratation_l
          ?
          Number(form.hydratation_l)
          :
          null,

        effort_type:
          form.effort_type,

        effort_duration:
          form.effort_duration
          ?
          Number(form.effort_duration)
          :
          null,

        sleep_hours:
          form.sleep_hours
          ?
          Number(form.sleep_hours)
          :
          null,

        sleep_quality:
          form.sleep_quality,

        stress_level:
          form.stress_level,

        stress_comment:
          form.stress_comment,

        digestion:
          form.digestion,

        digestion_comment:
          form.digestion_comment,

        energie:
          form.energie,

        emotionnel:
          form.emotionnel,

        douleurs:
          form.douleurs,

        health_note:
          form.health_note,

        entered_by:
          isClient()
          ?
          'client'
          :
          'naturopathe',

        payment_status:
          isNaturopathe()
          ?
          form.payment_status
          :
          'attente',

        payment_method:
          isNaturopathe()
          ?
          form.payment_method
          :
          null,

        payment_amount:
          isNaturopathe() &&
          form.payment_amount
          ?
          Number(form.payment_amount)
          :
          null
      };


      try{

        const {
          error
        } = await supabaseClient
          .from('vitalis_bilans')
          .insert(payload);

        if(error) throw error;

        await loadBilans();

        resetForm();

        showToast(
          'Bilan enregistré 💾'
        );

        await render();

        window.scrollTo({
          top:0,
          behavior:'smooth'
        });

      }catch(e){

        console.error(e);

        showToast(
          "Erreur d'enregistrement"
        );
      }
    };
  }


  document
    .querySelectorAll('[data-act="delete-bilan"]')
    .forEach(b=>{

      b.onclick=async()=>{

        if(!confirm(
          'Supprimer ce bilan ?'
        )) return;

        try{

          const {
            error
          } = await supabaseClient
            .from('vitalis_bilans')
            .delete()
            .eq('id',b.dataset.id);

          if(error) throw error;

          await loadBilans();

          await render();

          showToast(
            'Bilan supprimé'
          );

        }catch(e){

          console.error(e);

          showToast(
            'Erreur de suppression'
          );
        }
      };
    });
}


/* =========================================================
   INITIALISATION DE L'APPLICATION
   ========================================================= */

async function initApp(){

  if(isNaturopathe()){

    activeTab='clients';

    await loadClients();

    if(clients.length){

      activeClientId=
        clients[0].id;

      await loadActiveClient();

      await loadBilans();

    }else{

      activeClientId=null;
      activeClientData=null;
      bilans=[];
    }

    await render();

    return;
  }


  if(isClient()){

    const success=
      await loadClientAccount();

    if(!success){

      document.getElementById(
        'app-header'
      ).style.display='none';

      document.getElementById(
        'tabbar'
      ).style.display='none';

      document.getElementById(
        'main'
      ).innerHTML=`

        <div class="auth-wrap">

          <div class="card">

            <div class="section-label">
              ⚠️ Compte non associé
            </div>

            <div class="empty">

              Ton compte client est bien connecté,
              mais aucune fiche cliente ne correspond
              à ton adresse e-mail.

            </div>

            <button
              class="btn-primary"
              id="logout-error-btn"
            >
              Se déconnecter
            </button>

          </div>

        </div>
      `;

      document.getElementById(
        'logout-error-btn'
      ).onclick=logout;

      return;
    }

    activeTab='new';

    await render();

    return;
  }
}


/* =========================================================
   DÉMARRAGE
   ========================================================= */

async function start(){

  const session=
    await getSession();

  if(!session){

    renderLogin();

    return;
  }

  currentUser=
    session.user;

  await loadProfile();

  if(!currentProfile){

    await supabaseClient.auth.signOut();

    currentUser=null;

    renderLogin(
      "Ton compte existe mais ton profil VITALIS n'a pas été trouvé."
    );

    return;
  }

  if(!isNaturopathe() && !isClient()){

    await supabaseClient.auth.signOut();

    currentUser=null;
    currentProfile=null;

    renderLogin(
      "Le rôle de ton compte n'est pas reconnu."
    );

    return;
  }

  await initApp();
}


/* =========================================================
   SURVEILLANCE SESSION
   ========================================================= */

supabaseClient.auth.onAuthStateChange(
  async(event,session)=>{

    if(event==='SIGNED_OUT'){

      currentUser=null;
      currentProfile=null;

      renderLogin();

    }
  }
);


start();

</script>
