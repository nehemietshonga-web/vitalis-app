/* =========================================================

/* =========================================================
   HELPERS
   ========================================================= */

function todayStr(){
  return new Date().toISOString().slice(0,10);
}

function escapeHtml(s){
  return (s || '')
    .toString()
    .replace(/[&<>"']/g, c => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[c]));
}

function formatDate(d){
  if(!d) return '';

  const [y,m,day] =
    d.split('-');

  const months = [
    'janv.','févr.','mars','avr.',
    'mai','juin','juil.','août',
    'sept.','oct.','nov.','déc.'
  ];

  return `${day} ${months[Number(m)-1]} ${y}`;
}

function calcAge(birthDate){
  if(!birthDate) return null;

  const b = new Date(birthDate);
  const n = new Date();

  let age =
    n.getFullYear() -
    b.getFullYear();

  if(
    n.getMonth() < b.getMonth() ||
    (
      n.getMonth() === b.getMonth() &&
      n.getDate() < b.getDate()
    )
  ){
    age--;
  }

  return age;
}

function calcBMI(heightCm, weightKg){
  if(!heightCm || !weightKg)
    return null;

  const h =
    Number(heightCm) / 100;

  return (
    Number(weightKg) /
    (h * h)
  ).toFixed(1);
}

  t.textContent = msg;

/* =========================================================
   SUPABASE AUTH
   ========================================================= */

async function checkAuth(){

  if(!supabaseClient){
    return;
  }

  try{

    const {
      data,
      error
    } =
      await supabaseClient.auth.getSession();

    if(error){
      console.error(error);
      return;
    }

    currentSession =
      data.session || null;

    currentUser =
      currentSession
        ? currentSession.user
        : null;

    /*
      Vérifie si Supabase vient de rediriger
      l'utilisateur après une récupération
      de mot de passe.
    */

    const hash =
      window.location.hash || '';

    if(
      hash.includes('type=recovery') ||
      hash.includes('access_token=')
    ){
      isRecoveryMode = true;
    }

    /*
      Écoute les changements d'authentification.
    */

    supabaseClient.auth.onAuthStateChange(
      async (event, session) => {

        currentSession =
          session || null;

        currentUser =
          session
            ? session.user
            : null;

        if(event === 'PASSWORD_RECOVERY'){
          isRecoveryMode = true;
          render();
          return;
        }

        if(event === 'SIGNED_IN'){
          currentSession = session;
          currentUser =
            session ? session.user : null;

          if(!isRecoveryMode){
            await afterLogin();
          }

          render();
          return;
        }

        if(event === 'SIGNED_OUT'){
          currentSession = null;
          currentUser = null;
          clients = [];
          activeClientData = null;
          bilans = [];

          render();
        }

      }
    );

  }catch(error){
    console.error(
      'Erreur vérification session:',
      error
    );
  }
}

/* =========================================================
   LOGIN
   ========================================================= */

async function loginUser(email,password){

  if(!supabaseClient){
    showAuthMessage(
      'Supabase n’est pas correctement chargé.'
    );
    return;
  }

  const btn =
    document.getElementById('login-btn');

  if(btn){
    btn.disabled = true;
    btn.textContent = 'Connexion...';
  }

  clearAuthMessage();

  try{

    const {
      data,
      error
    } =
      await supabaseClient.auth.signInWithPassword({
        email:email.trim(),
        password
      });

    if(error){
      throw error;
    }

    currentSession =
      data.session;

    currentUser =
      data.user;

    showToast('Connexion réussie ✅');

    await afterLogin();

  }catch(error){

    console.error(error);

    let message =
      'Impossible de se connecter.';

    if(
      error.message &&
      error.message.toLowerCase().includes(
        'invalid login credentials'
      )
    ){
      message =
        'E-mail ou mot de passe incorrect.';
    }

    if(
      error.message &&
      error.message.toLowerCase().includes(
        'email not confirmed'
      )
    ){
      message =
        'Ton adresse e-mail n’est pas encore confirmée.';
    }

    showAuthMessage(message);

  }finally{

/* =========================================================
   MOT DE PASSE OUBLIE
   ========================================================= */

async function sendPasswordRecovery(email){

  if(!supabaseClient){
    showAuthMessage(
      'Supabase n’est pas correctement chargé.'
    );
    return;
  }

  if(!email || !email.trim()){
    showAuthMessage(
      'Entre ton adresse e-mail.'
    );
    return;
  }

  const btn =
    document.getElementById(
      'recovery-btn'
    );

  if(btn){
    btn.disabled = true;
    btn.textContent = 'Envoi...';
  }

  clearAuthMessage();

  try{

    const redirectUrl =
      baseUrl();

    const {
      error
    } =
      await supabaseClient.auth.resetPasswordForEmail(
        email.trim(),
        {
          redirectTo:redirectUrl
        }
      );

    if(error){
      throw error;
    }

    showAuthMessage(
      'E-mail envoyé ✅ Vérifie ta boîte de réception et tes spams. Le lien te ramènera ici pour choisir un nouveau mot de passe.',
      'success'
    );

  }catch(error){

    console.error(
      'Recovery error:',
      error
    );

    showAuthMessage(
      error.message ||
      'Impossible d’envoyer l’e-mail de récupération.'
    );

  }finally{

    if(btn){
      btn.disabled = false;
      btn.textContent =
        'Envoyer le lien de récupération';
    }

  }
}

/* =========================================================
   NOUVEAU MOT DE PASSE
   ========================================================= */

async function updatePassword(password,confirmPassword){

  if(!supabaseClient){
    showAuthMessage(
      'Supabase n’est pas correctement chargé.'
    );
    return;
  }

  if(password.length < 6){
    showAuthMessage(
      'Le mot de passe doit contenir au moins 6 caractères.'
    );
    return;
  }

  if(password !== confirmPassword){
    showAuthMessage(
      'Les deux mots de passe ne correspondent pas.'
    );
    return;
  }

  const btn =
    document.getElementById(
      'update-password-btn'
    );

  if(btn){
    btn.disabled = true;
    btn.textContent =
      'Enregistrement...';
  }

  clearAuthMessage();

  try{

    const {
      error
    } =
      await supabaseClient.auth.updateUser({
        password
      });

    if(error){
      throw error;
    }

    isRecoveryMode = false;

    showAuthMessage(
      'Nouveau mot de passe enregistré ✅ Tu peux maintenant accéder à VITALIS.',
      'success'
    );

    setTimeout(async () => {

      /*
        Nettoie le hash de récupération
        dans l'adresse.
      */

      window.history.replaceState(
        {},
        document.title,
        baseUrl()
      );

      await supabaseClient.auth.signOut();

      render();

    }, 1800);

  }catch(error){

    console.error(error);

    showAuthMessage(
      error.message ||
      'Impossible de modifier le mot de passe.'
    );

  }finally{

    if(btn){
      btn.disabled = false;
      btn.textContent =
        'Enregistrer le nouveau mot de passe';
    }

  }
}

/* =========================================================

   ========================================================= */

async function logout(){

  if(!supabaseClient)
    return;

  try{

    await supabaseClient.auth.signOut();

    currentSession = null;
    currentUser = null;

    activeClientId =
      isClientMode
        ? CLIENT_MODE_ID
        : null;

    activeClientData = null;
    clients = [];
    bilans = [];

    activeTab =
      isClientMode
        ? 'new'
        : 'clients';

    render();

  }catch(error){
    console.error(error);
  }
}

   ========================================================= */

async function afterLogin(){

  if(isClientMode){

    await loadActiveClient();
    await loadBilans();

  }else{

    await loadClients();

    if(
      clients.length &&
      !activeClientId
    ){

      activeClientId =
        clients[0].id;

      await loadActiveClient();
      await loadBilans();

    }

  }

  render();
}

/* =========================================================
   DATA LOADING
   ========================================================= */

async function sb(path, opts={}){

  if(!supabaseClient){
    throw new Error(
      'Supabase non disponible.'
    );
  }

  const {
    data,
    error
  } =
    await supabaseClient
      .from(
        path.split('?')[0]
      )
      .select();

  /*
    Cette fonction est conservée uniquement
    pour compatibilité.
  */

  return data;
}

async function loadClients(){

  if(!supabaseClient){
    return;
  }

  try{

    const {
      data,
      error
    } =
      await supabaseClient
        .from('vitalis_clients')
        .select('*')
        .order(
          'created_at',
          { ascending:false }
        );

    if(error)
      throw error;

    clients =
      data || [];

  }catch(error){

    console.error(
      'loadClients:',
      error
    );

    clients = [];

    showToast(
      'Impossible de charger les clientes'
    );
  }
}

async function loadActiveClient(){

  if(
    !supabaseClient ||
    !activeClientId
  ){

    activeClientData = null;
    return;
  }

  try{

    const {
      data,
      error
    } =
      await supabaseClient
        .from('vitalis_clients')
        .select('*')
        .eq(
          'id',
          activeClientId
        )
        .limit(1);

    if(error)
      throw error;

    activeClientData =
      data && data[0]
        ? data[0]
        : null;

  }catch(error){

    console.error(
      'loadActiveClient:',
      error
    );

    activeClientData = null;
  }
}

async function loadBilans(){

  if(
    !supabaseClient ||
    !activeClientId
  ){

    bilans = [];
    return;
  }

  try{

    const {
      data,
      error
    } =
      await supabaseClient
        .from('vitalis_bilans')
        .select('*')
        .eq(
          'client_id',
          activeClientId
        )
        .order(
          'date',
          { ascending:false }
        );

    if(error)
      throw error;

    bilans =
      data || [];

  }catch(error){

    console.error(
      'loadBilans:',
      error
    );

    bilans = [];

    showToast(
      'Impossible de charger les bilans'
    );
  }
}

   ========================================================= */

function renderProgress(){

  const c =
    activeClient();

  if(!c){

    return `
      <div class="card">
        <div class="empty">
          Sélectionne une cliente.
        </div>
      </div>
    `;
  }

  if(bilans.length === 0){

    return `
      <div class="card">
        <div class="empty">
          Pas encore assez de données.
        </div>
      </div>
    `;
  }

  const sorted =
    [...bilans]
      .sort(
        (a,b) =>
          a.date.localeCompare(b.date)
      );

  const withWeight =
    sorted.filter(e => e.weight);

  const withSleep =
    sorted.filter(e => e.sleep_hours);

  const avgSleep =
    withSleep.length
      ? (
          withSleep.reduce(
            (s,e) =>
              s + Number(e.sleep_hours),
            0
          ) /
          withSleep.length
        ).toFixed(1)
      : '—';

  const lastBmi =
    c.height_cm &&
    withWeight.length
      ? calcBMI(
          c.height_cm,
          withWeight[
            withWeight.length - 1
          ].weight
        )
      : null;

  function lineChart(
    list,
    key,
    lo,
    hi
  ){

    const w = 300;
    const h = 100;
    const pad = 10;

    const vals =
      list.map(
        e => Number(e[key])
      );

    let min =
      lo !== undefined
        ? lo
        : Math.min(...vals) - .5;

    let max =
      hi !== undefined
        ? hi
        : Math.max(...vals) + .5;

    if(max === min){
      max = min + 1;
    }

    const pts =
      list.map((e,i) => {

        const x =
          pad +
          (
            i /
            (list.length - 1 || 1)
          ) *
          (w - 2 * pad);

        const y =
          h -
          pad -
          (
            (Number(e[key]) - min) /
            (max - min)
          ) *
          (h - 2 * pad);

        return `${x},${y}`;

      }).join(' ');

    return `
      <svg viewBox="0 0 ${w} ${h}">
        <polyline
          points="${pts}"
          fill="none"
          stroke="#4f7a5c"
          stroke-width="2.5"
          stroke-linejoin="round"
          stroke-linecap="round"
        />
      </svg>
    `;
  }

  const weightChart =
    withWeight.length >= 2

      ? `

        <div class="card">

          <div class="section-label">
            ⚖️ Évolution du poids
          </div>

          <div class="chart-wrap">
            ${lineChart(
              withWeight,
              'weight'
            )}
          </div>

          <div class="chart-caption">

            <span>
              ${withWeight[0].weight}kg
            </span>

            <span>
              ${
                withWeight[
                  withWeight.length - 1
                ].weight
              }kg
            </span>

          </div>

        </div>
      `

      : '';

  const sleepChart =
    withSleep.length >= 2

      ? `

        <div class="card">

          <div class="section-label">
            😴 Évolution du sommeil
          </div>

          <div class="chart-wrap">
            ${lineChart(
              withSleep,
              'sleep_hours',
              0,
              10
            )}
          </div>

        </div>
      `

      : '';

  const totalPaye =
    sorted
      .filter(
        e => e.payment_status === 'paye'
      )
      .reduce(
        (s,e) =>
          s + (Number(e.payment_amount) || 0),
        0
      );

  const countAttente =
    sorted.filter(
      e =>
        e.payment_status === 'attente'
    ).length;

  return `

    <div class="stat-grid">

      <div class="stat-box">
        <div class="num">
          ${sorted.length}
        </div>
        <div class="lbl">
          📋 Bilans
        </div>
      </div>

      <div class="stat-box">
        <div class="num">
          ${avgSleep}
        </div>
        <div class="lbl">
          😴 Sommeil moyen
        </div>
      </div>

      <div class="stat-box">
        <div class="num">
          ${
            withWeight.length
              ? withWeight[
                  withWeight.length - 1
                ].weight
              : '—'
          }
        </div>
        <div class="lbl">
          ⚖️ Dernier poids
        </div>
      </div>

      <div class="stat-box">
        <div class="num">
          ${lastBmi || '—'}
        </div>
        <div class="lbl">
          📐 IMC actuel
        </div>
      </div>

    </div>

    <div class="card">

      <div class="section-label">
        💰 Paiements
      </div>

      <div class="entry-stats">

        <span>
          Total encaissé :
          <b style="color:var(--green)">
            ${totalPaye}
          </b>
        </span>

        <span>
          En attente :
          <b style="color:var(--terracotta)">
            ${countAttente}
          </b>
        </span>

      </div>

    </div>

    ${weightChart}
    ${sleepChart}

  `;
}

function render(){

  /*
    Si nous sommes dans l'espace cliente
    et qu'elle n'est pas connectée,
    on conserve le fonctionnement du lien.
  */

  if(
    !isClientMode &&
    !currentSession
  ){

    document.getElementById(
      'header-subtitle'
    ).textContent =
      'CONNEXION';

    renderAuth();
    return;
  }

  renderHeader();
  renderTabs();

  const main =
    document.getElementById('main');

  if(
    activeTab === 'clients' &&
    !isClientMode
  ){

    main.innerHTML =
      renderClients();

  }else if(
    activeTab === 'profile'
  ){

    main.innerHTML =
      renderProfile();

  }else if(
    activeTab === 'new'
  ){

    main.innerHTML =
      renderNew();

  }else if(
    activeTab === 'history'
  ){

    main.innerHTML =
      renderHistory();

  }else{

    main.innerHTML =
      renderProgress();

  }

  attachHandlers();
}

/* =========================================================
   HANDLERS
   ========================================================= */

function attachHandlers(){

  const pill =
    document.getElementById(
      'client-pill'
    );

  if(pill){

    pill.onclick = () => {

      activeTab =
        'clients';

      render();

    };

  }

  /*
    LOGOUT
  */

  const logoutBtn =
    document.getElementById(
      'logout-btn'
    );

  if(logoutBtn){

    logoutBtn.onclick =
      logout;

  }

  /*
    CLIENT SELECT
  */

  document
    .querySelectorAll(
      '[data-act="select-client"]'
    )
    .forEach(el => {

      el.onclick =
        async ev => {

          if(
            ev.target.closest(
              '[data-act="delete-client"]'
            )
          ){
            return;
          }

          activeClientId =
            el.dataset.id;

          await loadActiveClient();
          await loadBilans();

          activeTab =
            'profile';

          render();

        };

    });

  /*
    DELETE CLIENT
  */

  document
    .querySelectorAll(
      '[data-act="delete-client"]'
    )
    .forEach(el => {

      el.onclick =
        async ev => {

          ev.stopPropagation();

          if(
            !confirm(
              'Supprimer cette cliente et ses bilans ?'
            )
          ){
            return;
          }

          try{

            /*
              Les bilans doivent être supprimés
              avant la cliente si la base possède
              une contrainte de clé étrangère.
            */

            await supabaseClient
              .from('vitalis_bilans')
              .delete()
              .eq(
                'client_id',
                el.dataset.id
              );

            const {
              error
            } =
              await supabaseClient
                .from('vitalis_clients')
                .delete()
                .eq(
                  'id',
                  el.dataset.id
                );

            if(error)
              throw error;

            if(
              activeClientId ===
              el.dataset.id
            ){

              activeClientId = null;
              activeClientData = null;
              bilans = [];

            }

            await loadClients();

            showToast(
              'Cliente supprimée'
            );

            render();

          }catch(error){

            console.error(error);

            showToast(
              'Erreur lors de la suppression'
            );

          }

        };

    });

  /*
    ADD CLIENT
  */

  const nameEl =
    document.getElementById(
      'new-client-name'
    );

  if(nameEl){

    nameEl.oninput =
      e =>
        newClientName =
          e.target.value;

  }

  const addBtn =
    document.getElementById(
      'add-client-btn'
    );

  if(addBtn){

    addBtn.onclick =
      async () => {

        if(
          !newClientName.trim()
        ){

          showToast(
            'Entre un nom'
          );

          return;
        }

        try{

          const {
            data,
            error
          } =
            await supabaseClient
              .from('vitalis_clients')
              .insert({
                name:
                  newClientName.trim(),
                objectifs:[]
              })
              .select();

          if(error)
            throw error;

          newClientName = '';

          await loadClients();

          if(
            data &&
            data[0]

            activeClientId =
              data[0].id;

            await loadActiveClient();
            await loadBilans();

          }

          showToast(

          if(error)

          await loadActiveClient();

          editingAdmission =

          showToast(

  /*

            showToast(

/* =========================================================
   INIT
   ========================================================= */

async function init(){

  try{

    /*
      Vérifie d'abord la session Supabase.
    */

    await checkAuth();

    /*
      L'espace cliente continue d'utiliser
      son identifiant de lien.
    */

    if(isClientMode){

      await loadActiveClient();
      await loadBilans();

      render();

      return;
    }

    /*
      L'espace naturopathe nécessite
      maintenant une connexion.
    */

    if(!currentSession){

      render();

      return;
    }

    await afterLogin();

  }catch(error){

    console.error(
      'Erreur initialisation:',
      error
    );

    document.getElementById(
      'main'
    ).innerHTML = `

      <div class="card">

        <div class="section-label">
          ⚠️ ERREUR
        </div>

        <p style="
          font-size:13px;
          line-height:1.5;
          color:var(--text-muted);
        ">
          VITALIS a rencontré une erreur
          lors du chargement.
        </p>

        <div class="link-box">
          ${escapeHtml(
            error.message ||
            'Erreur inconnue'
          )}
        </div>

        <button
          class="btn-primary"
          onclick="location.reload()"
        >
          Recharger VITALIS
        </button>

      </div>

    `;

  }

}

init();
